name: Production DevSecOps CI Pipeline

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write         # OIDC authentication with AWS STS AssumeRoleWithWebIdentity
  security-events: write  # For uploading Trivy SARIF reports to GitHub Security tab

env:
  AWS_REGION: ap-southeast-2
  ECR_BACKEND_REPO: staging-myblogspot-backend
  ECR_FRONTEND_REPO: staging-myblogspot-frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. SHIFT-LEFT SECURITY GATE: Gitleaks Secret Detection & Trivy FS Scan
  # ============================================================================
  security-sast:
    name: Shift-Left Security (Gitleaks & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Run Trivy Filesystem Security Scan (SARIF output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy FS SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

  # ============================================================================
  # 2. BACKEND QUALITY GATE: Go Lint, Unit & Integration Tests (PostgreSQL)
  # ============================================================================
  test-backend:
    name: Test Backend (Go 1.26 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: myblogspot
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: myblogspot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myblogspot -d myblogspot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: 'backend/go.sum'

      - name: Verify Module Dependencies
        run: |
          cd backend
          go mod verify

      - name: Run Go Vet
        run: |
          cd backend
          go vet ./...

      - name: Apply Database Schema Migration
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=secret psql -h localhost -p 5432 -U myblogspot -d myblogspot_test -f backend/internal/db/schema.sql

      - name: Run Backend Unit Tests with Race Detector & Coverage
        run: |
          cd backend
          go test -v -race -coverprofile=unit-coverage.txt -covermode=atomic ./tests/unit/...

      - name: Run Backend Integration Tests with Race Detector
        run: |
          cd backend
          go test -v -race -coverprofile=integration-coverage.txt -covermode=atomic ./tests/integration/...

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-coverage
          path: |
            backend/unit-coverage.txt
            backend/integration-coverage.txt
          retention-days: 7

  # ============================================================================
  # 3. FRONTEND QUALITY GATE: Next.js Type Check, Lint & Build
  # ============================================================================
  test-frontend:
    name: Test Frontend (Next.js 15)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd frontend
          npm run type-check

      - name: Next.js ESLint
        run: |
          cd frontend
          npm run lint

      - name: Next.js Production Build Verification
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:8080'
          INTERNAL_API_URL: 'http://backend:8080'
          NODE_ENV: 'production'
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 4. CONTAINER SECURITY & REGISTRY PUBLISH: Build, Trivy Scan & Push to ECR
  # ============================================================================
  build-and-publish-containers:
    name: Build, Scan & Publish Images (AWS ECR Sydney)
    runs-on: ubuntu-latest
    needs: [security-sast, test-backend, test-frontend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend Container Build & Scan
      - name: Build Backend Docker Image (Local Test)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: myblogspot-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Built Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myblogspot-backend:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      # Frontend Container Build & Scan
      - name: Build Frontend Docker Image (Local Test)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: myblogspot-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Built Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myblogspot-frontend:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      # Authenticate to AWS via Keyless OIDC (ap-southeast-2 Sydney)
      - name: Configure AWS Credentials (OIDC Keyless)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Backend Image to ECR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TARGET_IMAGE="${ECR_REGISTRY}/${{ env.ECR_BACKEND_REPO }}:${IMAGE_TAG}"
          echo "Tagging and pushing backend image -> ${TARGET_IMAGE}"
          docker tag myblogspot-backend:test "${TARGET_IMAGE}"
          docker push "${TARGET_IMAGE}"

      - name: Tag and Push Frontend Image to ECR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TARGET_IMAGE="${ECR_REGISTRY}/${{ env.ECR_FRONTEND_REPO }}:${IMAGE_TAG}"
          echo "Tagging and pushing frontend image -> ${TARGET_IMAGE}"
          docker tag myblogspot-frontend:test "${TARGET_IMAGE}"
          docker push "${TARGET_IMAGE}"

  # ============================================================================
  # 5. GITOPS CONTINUOUS DELIVERY: Update Image Tag in myblogspot-cd
  # Ref: Knowledge_Base/CI_CD.md & GitOps Pattern
  # Automatically triggers ArgoCD reconciliation by updating Helm values
  # ============================================================================
  gitops-cd-trigger:
    name: GitOps Trigger (Update Image Tag in CD Repo)
    runs-on: ubuntu-latest
    needs: [build-and-publish-containers]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Verify CD Auth Configuration
        id: check-auth
        run: |
          if [ -n "${{ secrets.GITOPS_PAT }}" ]; then
            echo "auth_type=pat" >> "$GITHUB_OUTPUT"
            echo "✅ GITOPS_PAT token detected."
          elif [ -n "${{ secrets.CD_DEPLOY_KEY }}" ]; then
            echo "auth_type=deploy_key" >> "$GITHUB_OUTPUT"
            echo "✅ CD_DEPLOY_KEY SSH key detected."
          else
            echo "auth_type=none" >> "$GITHUB_OUTPUT"
            echo "::warning ::Neither GITOPS_PAT nor CD_DEPLOY_KEY is configured in GitHub Secrets. Automated GitOps push will be skipped."
          fi

      # Option 1: Checkout using PAT
      - name: Checkout CD Repository (via PAT)
        if: steps.check-auth.outputs.auth_type == 'pat'
        uses: actions/checkout@v4
        with:
          repository: 'gryffin-uit-alpha/myblogspot-cd'
          token: ${{ secrets.GITOPS_PAT }}
          ref: 'main'
          path: 'myblogspot-cd'

      # Option 2: Checkout using SSH Deploy Key
      - name: Checkout CD Repository (via Deploy Key)
        if: steps.check-auth.outputs.auth_type == 'deploy_key'
        uses: actions/checkout@v4
        with:
          repository: 'gryffin-uit-alpha/myblogspot-cd'
          ssh-key: ${{ secrets.CD_DEPLOY_KEY }}
          ref: 'main'
          path: 'myblogspot-cd'

      # Update YAML using yq
      - name: Update Staging Image Tag
        if: steps.check-auth.outputs.auth_type != 'none'
        run: |
          cd myblogspot-cd
          IMAGE_TAG="${{ github.sha }}"
          VALUES_FILE="helm/myblogspot/values-staging.yaml"

          echo "Updating $VALUES_FILE with image tag: $IMAGE_TAG"
          yq eval ".backend.image.tag = \"${IMAGE_TAG}\"" -i "$VALUES_FILE"
          yq eval ".frontend.image.tag = \"${IMAGE_TAG}\"" -i "$VALUES_FILE"

          echo "=== Diff Preview ==="
          git diff "$VALUES_FILE"

      - name: Commit and Push Image Tag Update
        if: steps.check-auth.outputs.auth_type != 'none'
        run: |
          cd myblogspot-cd
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VALUES_FILE="helm/myblogspot/values-staging.yaml"
          git add "$VALUES_FILE"

          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(cd): update staging image tag to ${{ github.sha }} [skip ci]"
            git push origin main
            echo "🚀 Successfully updated myblogspot-cd with tag: ${{ github.sha }}"
          fi
