name: Production DevSecOps CI Pipeline

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # For uploading Trivy SARIF reports to GitHub Security tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. SHIFT-LEFT SECURITY GATE: Gitleaks Secret Detection & Trivy FS Scan
  # ============================================================================
  security-sast:
    name: Shift-Left Security (Gitleaks & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Run Trivy Filesystem Security Scan (SARIF output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy FS SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

  # ============================================================================
  # 2. BACKEND QUALITY GATE: Go Linting, Formatting & Unit Tests
  # ============================================================================
  test-backend:
    name: Test Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: 'backend/go.sum'

      - name: Verify Module Dependencies
        run: |
          cd backend
          go mod verify

      - name: Run Go Vet
        run: |
          cd backend
          go vet ./...

      - name: Run Backend Unit Tests with Race Detector & Coverage
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./tests/unit/...

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-coverage
          path: backend/coverage.txt
          retention-days: 7

  # ============================================================================
  # 3. FRONTEND QUALITY GATE: Next.js Type Check, Lint & Build
  # ============================================================================
  test-frontend:
    name: Test Frontend (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd frontend
          npm run type-check

      - name: Next.js ESLint
        run: |
          cd frontend
          npm run lint

      - name: Next.js Production Build Verification
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:8080'
          INTERNAL_API_URL: 'http://backend:8080'
          NODE_ENV: 'production'
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 4. CONTAINER VERIFICATION: Multi-Stage Build & Trivy Image Security Scan
  #    (Note: Container registry push & Cosign signing will be activated once
  #     registry repositories and credentials are provisioned in Step 2)
  # ============================================================================
  build-and-test-containers:
    name: Build & Verify Docker Images (Local Validation)
    runs-on: ubuntu-latest
    needs: [security-sast, test-backend, test-frontend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend Container Build & Scan
      - name: Build Backend Docker Image (Local Test)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: myblogspot-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Built Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myblogspot-backend:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      # Frontend Container Build & Scan
      - name: Build Frontend Docker Image (Local Test)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: myblogspot-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Built Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myblogspot-frontend:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
