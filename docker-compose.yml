services:
  postgres:
    image: postgres:15-alpine
    container_name: myblogspot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myblogspot
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myblogspot_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internal/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/internal/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myblogspot -d myblogspot_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myblogspot-net

  redis:
    image: redis:7-alpine
    container_name: myblogspot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - myblogspot-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myblogspot_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      ENV: "development"
      BASE_URL: "http://localhost:8080"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "myblogspot"
      DB_PASSWORD: "secret"
      DB_NAME: "myblogspot_dev"
      DB_SSLMODE: "disable"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_ENABLED: "true"
      JWT_SECRET: "myblogspot_jwt_secret_dev_key_32_bytes_min!"
      JWT_EXPIRATION: "3600"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_WINDOW: "60"
      ADMIN_INITIAL_USERNAME: "admin"
      ADMIN_INITIAL_PASSWORD: "admin123"
      ADMIN_INITIAL_EMAIL: "admin@myblogspot.local"
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - myblogspot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myblogspot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      INTERNAL_API_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    networks:
      - myblogspot-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: myblogspot_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - myblogspot-net

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  myblogspot-net:
    driver: bridge
